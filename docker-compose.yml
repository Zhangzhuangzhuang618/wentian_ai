services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wentian
      POSTGRES_USER: wentian
      POSTGRES_PASSWORD: ${WENTIAN_POSTGRES_PASSWORD:?set WENTIAN_POSTGRES_PASSWORD}
    volumes:
      - wentian-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${WENTIAN_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wentian -d wentian"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-store:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${WENTIAN_S3_ACCESS_KEY:?set WENTIAN_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${WENTIAN_S3_SECRET_KEY:?set WENTIAN_S3_SECRET_KEY}
    volumes:
      - wentian-object-data:/data
    ports:
      - "127.0.0.1:${WENTIAN_S3_PORT:-9000}:9000"
      - "127.0.0.1:${WENTIAN_S3_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-store-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://object-store:9000 "$${WENTIAN_S3_ACCESS_KEY}" "$${WENTIAN_S3_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${WENTIAN_OBJECT_STORE_BUCKET}"
    environment:
      WENTIAN_S3_ACCESS_KEY: ${WENTIAN_S3_ACCESS_KEY}
      WENTIAN_S3_SECRET_KEY: ${WENTIAN_S3_SECRET_KEY}
      WENTIAN_OBJECT_STORE_BUCKET: ${WENTIAN_OBJECT_STORE_BUCKET:-wentian-evidence}
    depends_on:
      object-store:
        condition: service_healthy
    restart: "no"

  migrations:
    build: .
    command: ["pnpm", "db:migrate"]
    environment:
      WENTIAN_DATABASE_URL: postgresql://wentian:${WENTIAN_POSTGRES_PASSWORD}@postgres:5432/wentian
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      PORT: 3000
      WENTIAN_BIND_HOST: 0.0.0.0
      WENTIAN_DATABASE_URL: postgresql://wentian:${WENTIAN_POSTGRES_PASSWORD}@postgres:5432/wentian
      WENTIAN_OBJECT_STORE_ENDPOINT: http://object-store:9000
      WENTIAN_OBJECT_STORE_BUCKET: ${WENTIAN_OBJECT_STORE_BUCKET:-wentian-evidence}
      WENTIAN_S3_ACCESS_KEY: ${WENTIAN_S3_ACCESS_KEY}
      WENTIAN_S3_SECRET_KEY: ${WENTIAN_S3_SECRET_KEY}
      WENTIAN_SESSION_SECRET: ${WENTIAN_SESSION_SECRET:?set WENTIAN_SESSION_SECRET}
      WENTIAN_GEO_CONNECTOR_MASTER_SECRET: ${WENTIAN_GEO_CONNECTOR_MASTER_SECRET:-}
      WENTIAN_PUBLIC_ORIGIN: ${WENTIAN_PUBLIC_ORIGIN:-http://127.0.0.1:3000}
      WENTIAN_COOKIE_SECURE: ${WENTIAN_COOKIE_SECURE:-false}
      WENTIAN_DOUBAO_AUTOMATION_ENVIRONMENT: ${WENTIAN_DOUBAO_AUTOMATION_ENVIRONMENT:-production}
      WENTIAN_DOUBAO_AUTOMATION_AUTHORIZATION_BASIS: ${WENTIAN_DOUBAO_AUTOMATION_AUTHORIZATION_BASIS:-none}
      WENTIAN_DOUBAO_AUTOMATION_AUTHORIZATION_EVIDENCE_ID: ${WENTIAN_DOUBAO_AUTOMATION_AUTHORIZATION_EVIDENCE_ID:-}
      WENTIAN_DOUBAO_AUTOMATION_AUTHORIZATION_REVIEWED_AT: ${WENTIAN_DOUBAO_AUTOMATION_AUTHORIZATION_REVIEWED_AT:-}
      WENTIAN_QIANWEN_AUTOMATION_ENVIRONMENT: ${WENTIAN_QIANWEN_AUTOMATION_ENVIRONMENT:-production}
      WENTIAN_QIANWEN_AUTOMATION_AUTHORIZATION_BASIS: ${WENTIAN_QIANWEN_AUTOMATION_AUTHORIZATION_BASIS:-none}
      WENTIAN_QIANWEN_AUTOMATION_AUTHORIZATION_EVIDENCE_ID: ${WENTIAN_QIANWEN_AUTOMATION_AUTHORIZATION_EVIDENCE_ID:-}
      WENTIAN_QIANWEN_AUTOMATION_AUTHORIZATION_REVIEWED_AT: ${WENTIAN_QIANWEN_AUTOMATION_AUTHORIZATION_REVIEWED_AT:-}
      WENTIAN_DEEPSEEK_AUTOMATION_ENVIRONMENT: ${WENTIAN_DEEPSEEK_AUTOMATION_ENVIRONMENT:-production}
      WENTIAN_DEEPSEEK_AUTOMATION_AUTHORIZATION_BASIS: ${WENTIAN_DEEPSEEK_AUTOMATION_AUTHORIZATION_BASIS:-none}
      WENTIAN_DEEPSEEK_AUTOMATION_AUTHORIZATION_EVIDENCE_ID: ${WENTIAN_DEEPSEEK_AUTOMATION_AUTHORIZATION_EVIDENCE_ID:-}
      WENTIAN_DEEPSEEK_AUTOMATION_AUTHORIZATION_REVIEWED_AT: ${WENTIAN_DEEPSEEK_AUTOMATION_AUTHORIZATION_REVIEWED_AT:-}
    ports:
      - "127.0.0.1:${WENTIAN_API_PORT:-3000}:3000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully
    restart: unless-stopped

  retention:
    profiles: ["maintenance"]
    build: .
    command: ["pnpm", "retention:run"]
    environment:
      WENTIAN_DATABASE_URL: postgresql://wentian:${WENTIAN_POSTGRES_PASSWORD}@postgres:5432/wentian
      WENTIAN_OBJECT_STORE_ENDPOINT: http://object-store:9000
      WENTIAN_OBJECT_STORE_BUCKET: ${WENTIAN_OBJECT_STORE_BUCKET:-wentian-evidence}
      WENTIAN_S3_ACCESS_KEY: ${WENTIAN_S3_ACCESS_KEY}
      WENTIAN_S3_SECRET_KEY: ${WENTIAN_S3_SECRET_KEY}
    depends_on:
      migrations:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully
    restart: "no"

volumes:
  wentian-postgres-data:
  wentian-object-data:
